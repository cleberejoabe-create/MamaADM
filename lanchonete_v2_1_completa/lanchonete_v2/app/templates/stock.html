{% extends "base.html" %}{% block content %}
<h1>Estoque</h1>
<form class="panel inline-form" method="post" action="{{url_for('stock.move')}}">
<select name="product_id">{% for p in products %}<option value="{{p.id}}">{{p.name}} · atual {{p.stock}} {{p.unit}}</option>{% endfor %}</select>
<select name="type"><option value="entrada">Entrada</option><option value="saida">Saída</option></select>
<input name="quantity" type="number" step="0.01" min="0.01" placeholder="Quantidade" required>
<input name="reason" placeholder="Motivo">
<button class="btn primary">Registrar</button>
</form>
<div class="panel"><h2>Histórico</h2><table><tr><th>Data</th><th>Produto</th><th>Tipo</th><th>Quantidade</th><th>Motivo</th></tr>
{% for m in movements %}<tr><td>{{m.created_at.strftime("%d/%m/%Y %H:%M")}}</td><td>{{m.product.name}}</td><td>{{m.type}}</td><td>{{m.quantity}} {{m.product.unit}}</td><td>{{m.reason}}</td></tr>{% endfor %}
</table></div>
{% endblock %}
