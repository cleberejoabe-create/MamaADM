{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div><h1>Alterar senha</h1><p>Atualize a senha da conta <strong>{{ current_user.username }}</strong>.</p></div>
  <a class="btn" href="{{ url_for('users.profile') }}">Voltar</a>
</div>
<div class="panel" style="max-width:650px">
<form method="post">
  <div class="form-grid">
    <div><label>Senha atual<input type="password" name="current_password" required autocomplete="current-password"></label></div>
    <div></div>
    <div><label>Nova senha<input type="password" name="new_password" required minlength="6" autocomplete="new-password"></label></div>
    <div><label>Confirmar nova senha<input type="password" name="confirm_password" required minlength="6" autocomplete="new-password"></label></div>
  </div>
  <p class="hint">Use pelo menos 6 caracteres e evite senhas fáceis de adivinhar.</p>
  <button class="btn primary" type="submit">Salvar nova senha</button>
</form>
</div>
{% endblock %}
